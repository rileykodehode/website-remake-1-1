<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="a recreation of the website NetOnNet.no and done so for an assignment"
    />
    <link rel="stylesheet" href="css/style.css" />
    <title>NetOnNet Gjenskap</title>
  </head>
  <body>
    <header>
      <section class="kundeservice">
        <div id="kundeservice-left">
          <p><a href="">Kundeservice</a></p>
          <p><a href="">Finn Lagershop og åpningstider</a></p>
        </div>
        <p><a href="">Handle som bedrift</a></p>
      </section>

      <section class="user-header">
        <div>
          <img
            class="logo"
            src="images/netonnet-logo.svg"
            alt="logo of the company netonnet"
          />
        </div>
        <div id="log-on">Logg inn Handlevogn</div>
      </section>

      <section class="search-header">
        <div id="menu-icon">
          <img src="images/hamburger-menu.svg" alt="" />
          <p>Meny</p>
        </div>
        <div>
          <form action=""></form>
          <label for="search"></label>
          <input type="search" id="search" placeholder="Søk her..." />
        </div>
      </section>
    </header>

    <!-- Navigation Hero -->
    <nav class="nav-header">
      <div class="nav-container">
        <ul>
          <div id="card1">
            <li>Data og nettbrett</li>
          </div>
          <div id="card2">
            <li>Datakomponenter</li>
          </div>
          <div id="card3">
            <li>Gaming</li>
          </div>
          <div id="card4">
            <li>Hjem og fritid</li>
          </div>
          <div id="card5">
            <li>TV</li>
          </div>
          <div id="card6">
            <li>Lyd</li>
          </div>
          <div id="card7">
            <li>Mobil og smartklokker</li>
          </div>
          <div id="card8">
            <li>Personlig pleie</li>
          </div>
        </ul>
      </div>
    </nav>
  </body>

  <!-- Main Hero -->
  <main>
    <div id="hero-image">
      <img src="images/hero-sample.webp" alt="" />
    </div>
  </main>
</html>
